name: build-image

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      no-cache:
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          flavor: latest=true
          images: ${{ env.REGISTRY }}/fearlix-srl/${{ inputs.image-name }}

      - name: Build and push ${{ inputs.image-name }} Image
        id: build-and-push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ inputs.image-name }}
          file: ./${{ inputs.image-name }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ inputs.no-cache || github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/fearlix-srl/${{ inputs.image-name }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/fearlix-srl/{1}:buildcache,mode=max', env.REGISTRY, inputs.image-name) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

